name: Test AWX Deployment via Minikube
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-k8s-awx:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Diagnostic
        run: |
          echo "=== Runner Hardware & OS ==="
          uname -a
          lscpu || true
          free -h
          df -h

      - name: Setup Minikube & Kubernetes Tools
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: 1.34.0
          container-runtime: docker
          cpus: 4
          memory: 7168mb
          addons: ingress

      - name: Verify Minikube & Docker Environment
        run: |
          docker ps
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Clone and Deploy AWX Operator
        run: |
          git clone https://github.com/ansible/awx-operator.git
          cd awx-operator
          git checkout 2.19.0
          export NAMESPACE=awx
          kubectl create namespace ${NAMESPACE}
          kubectl config set-context --current --namespace=${NAMESPACE}
          make deploy
          kubectl -n awx set image deployment/awx-operator-controller-manager \
            kube-rbac-proxy=quay.io/brancz/kube-rbac-proxy:v0.15.0 || true
          kubectl -n awx rollout status deployment/awx-operator-controller-manager --timeout=600s
          kubectl -n awx get pods -o wide

      - name: Deploy AWX Instance Configuration
        run: |
          cat <<AWX_EOF > awx-instance.yaml
          apiVersion: awx.ansible.com/v1beta1
          kind: AWX
          metadata:
            name: my-awx
            namespace: awx
          spec:
            service_type: NodePort
          AWX_EOF
          kubectl apply -f awx-instance.yaml

      - name: Wait for Successful Database and Deployment Initialization
        run: |
          echo "Waiting for pods to be scheduled by operator..."
          for i in {1..60}; do
            if kubectl -n awx get pod -l app.kubernetes.io/name=my-awx-web --no-headers 2>/dev/null | grep -q .; then
              echo "AWX web pod scheduled."
              break
            fi
            echo "Waiting for operator to create pods ($i/60)..."
            sleep 10
          done

          echo "Waiting for PostgreSQL pod to be Ready..."
          kubectl -n awx wait --for=condition=ready pod -l app.kubernetes.io/managed-by=awx-operator,app.kubernetes.io/component=database --timeout=360s || true

          echo "Waiting for AWX Web pod to be Ready..."
          kubectl -n awx wait --for=condition=ready pod -l app.kubernetes.io/name=my-awx-web --timeout=600s

          echo "Waiting for AWX Task pod to be Ready..."
          kubectl -n awx wait --for=condition=ready pod -l app.kubernetes.io/name=my-awx-task --timeout=600s

          echo "All AWX pods are Ready!"
          kubectl -n awx get pods -o wide

      - name: Extract Admin Credentials and Validate Service
        run: |
          PASSWORD=$(kubectl -n awx get secret my-awx-admin-password -o jsonpath="{.data.password}" | base64 --decode)
          echo "=========================================================="
          echo "AWX Admin Username : admin"
          echo "AWX Admin Password : $PASSWORD"
          echo "=========================================================="
          kubectl -n awx get svc my-awx-service

          # Direct local endpoint verification
          NODE_IP=$(kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          NODE_PORT=$(kubectl -n awx get svc my-awx-service -o jsonpath='{.spec.ports[0].nodePort}')
          echo "Local NodePort endpoint: http://$NODE_IP:$NODE_PORT"
          curl -sI "http://$NODE_IP:$NODE_PORT" | head -n 10 || true

          # ------------------------------------------------------------------
          # Optional Tunnel for Remote Cloud Runners:
          # On a physical Mac, this is NOT needed because 'minikube service'
          # or NodePort gives direct localhost/LAN browser access.
          # ------------------------------------------------------------------
          # kubectl -n awx port-forward svc/my-awx-service 8050:80 &
          # curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          # chmod +x /tmp/cloudflared
          # /tmp/cloudflared tunnel --url http://localhost:8050 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          # sleep 5
          # grep -o "https://[a-zA-Z0-9-]*\.trycloudflare\.com" /tmp/tunnel.log | head -n 1
